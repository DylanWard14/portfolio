name: Main

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [publish-event]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build
        env:
          GATSBY_CONTACT_SERVICE_ID: ${{secrets.GATSBY_CONTACT_SERVICE_ID}}
          GATSBY_CONTACT_TEMPLATE_ID: ${{secrets.GATSBY_CONTACT_TEMPLATE_ID}}
          GATSBY_CONTACT_USER_ID: ${{secrets.GATSBY_CONTACT_USER_ID}}
          CONTENTFUL_SPACE_ID: ${{secrets.CONTENTFUL_SPACE_ID}}
          CONTENTFUL_ACCESS_TOKEN: ${{secrets.CONTENTFUL_ACCESS_TOKEN}}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Action defaults to Wrangler 3.90, which predates wrangler.jsonc support
          wranglerVersion: "4"
